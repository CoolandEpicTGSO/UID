# ============================================================
#   RegentHeadHunting - Spawner Upgrades
#
#   Speed upgrade currency: Prismarine Shards
#   Stack upgrade currency: Prismarine Shards
#
#   base-delay-seconds  - Default spawner cycle time in seconds
#   base-spawn-count    - Default mobs spawned per cycle
#
#   speed.effects.<tier>.delay-seconds-reduction
#     - How many seconds off the base delay at each tier
#   stack.effects.<tier>.spawn-count-add
#     - How many extra mobs per cycle at each tier
#
#   default-costs are used for all mobs unless a mob-specific
#   entry exists under mob-costs.<MOB_TYPE>.<tier>
# ============================================================

base-delay-seconds: 20
base-spawn-count: 1
# Maximum number of the same mob type allowed within 16 blocks before the spawner pauses
max-nearby-entities: 6

