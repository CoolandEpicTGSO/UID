# ============================================================
#   RegentHeadHunting - Missions
#
#   Three categories:
#     daily  - reset every day at the configured hour
#     weekly - reset on the configured day each week
#     elite  - permanent one-time completions, never reset
#
#   Each reset, 8 daily and 6 weekly missions are randomly
#   selected from the pools below. The same mission cannot
#   appear twice in one day/week, and the system avoids
#   repeating the previous rotation where possible.
#
#   Mission types (single-challenge):
#     KILL_ANY              - kill any mob tracked by the plugin
#     KILL_MOB              - kill a specific mob (set "mob: MOB_TYPE")
#     KILL_PLAYER           - kill other players
#     SELL_HEADS            - sell any mob heads
#     SELL_PLAYER_HEADS     - sell player heads specifically
#     SELL_SPECIFIC_MOB_HEADS - sell heads of a specific mob (set "mob")
#     MINE_ORE              - mine any ore block
#     MINE_SPECIFIC_ORE     - mine a specific ore (set "ore: MATERIAL")
#     FARM_CROP             - harvest fully-grown crops
#
#   Fields:
#     name, description, type, mob, ore, target,
#     reward-xp, reward-money, reward-commands, icon
#     (slot is not used in pool missions — position is assigned dynamically)
# ============================================================

missions:
  daily-reset-hour: 0
  weekly-reset-day: MONDAY
  daily-active-count: 8
  weekly-active-count: 6

  # ----------------------------------------------------------
  #  Bonus Loot Tables
  #  One bonus reward is rolled per mission claim.
  #  weight: relative probability (higher = more common)
  #  commands: console commands run for the player ({player} placeholder)
  #  display: shown in the mission lore as "+ Bonus Reward"
  # ----------------------------------------------------------
  daily-bonus-loot:
    common_xp:
      weight: 40
      display: "&7+ &e1x Experience Bottle"
      commands:
        - "give {player} experience_bottle 1"
    uncommon_xp:
      weight: 25
      display: "&7+ &e8x Experience Bottles"
      commands:
        - "give {player} experience_bottle 8"
    rare_xp:
      weight: 15
      display: "&7+ &e32x Experience Bottles"
      commands:
        - "give {player} experience_bottle 32"
    common_money:
      weight: 30
      display: "&7+ &a$500 &7bonus"
      commands:
        - "eco give {player} 500"
    uncommon_money:
      weight: 18
      display: "&7+ &a$2,000 &7bonus"
      commands:
        - "eco give {player} 2000"
    rare_money:
      weight: 8
      display: "&7+ &a$5,000 &7bonus"
      commands:
        - "eco give {player} 5000"
    uncommon_key:
      weight: 12
      display: "&7+ &61x Crate Key"
      commands:
        - "crates key give {player} key1 1"
    rare_key:
      weight: 4
      display: "&7+ &62x Crate Keys"
      commands:
        - "crates key give {player} key1 2"
    epic_key:
      weight: 1
      display: "&d+ &51x Rare Crate Key"
      commands:
        - "crates key give {player} key2 1"

  weekly-bonus-loot:
    common_money:
      weight: 30
      display: "&7+ &a$5,000 &7bonus"
      commands:
        - "eco give {player} 5000"
    uncommon_money:
      weight: 20
