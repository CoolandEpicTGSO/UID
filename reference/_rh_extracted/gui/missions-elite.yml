# ----------------------------------------------------------
#  Text customisation
#  Placeholders: {progress} {target} {percent} {currency}
#                {xp} {money}
# ----------------------------------------------------------
text:
  back-name: "&cBack"
  back-lore:
    - "&7Return to missions menu"

  progress-line: "&7Progress: &b{progress}&7/&b{target}"

  # Multi-challenge missions — one line per challenge
  # Placeholders: {label} {progress} {target} {percent}
  challenge-line: "&7{label}&b{progress}&7/&b{target}"
  challenge-line-done: "&a✔ &a{label}&a{progress}&7/&a{target}"

  rewards-header: "&7Rewards:"
  reward-xp-line: "  &bHH XP: &b{xp}"
  reward-money-line: "  &aMoney: &b{currency}{money}"
  reward-bonus-line: "  &d+ Bonus rewards"

  unclaimed-ready: "&a&lREWARDS READY!"
  unclaimed-click: "&bClick to claim your rewards!"
  completed-tag: "&a[COMPLETED]"

  progress-bar-prefix: "&7["
  progress-bar-filled: "&a|"
  progress-bar-empty: "&c|"
  progress-bar-suffix: "&7] &b{percent}%"
