# ============================================================
#   Max Level Missions GUI
# ============================================================
title: "&8[&6Max Level Missions&8]"
size: 54
filler-material: BLACK_STAINED_GLASS_PANE

# Slots where the 9 mission items are placed
# Row 1: 10-16 (7 missions)
# Row 2: Head Baron (20), Apex Hunter (22), Undead Hunter (24)
content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 20
  - 22
  - 24

slots:
  back: 49

# ----------------------------------------------------------
#  Text customisation
# ----------------------------------------------------------
text:
  back-name: "&cBack"
  back-lore:
    - "&7Return to main menu"

  # Mission item when not yet started
  not-started-suffix: "&7"
  not-started-lore-footer:
    - ""
    - "&eClick to start this mission!"

  # Mission locked due to unmet prerequisites
  prerequisites-not-met: "&c&lLOCKED &8— Complete all other missions first."

  # Mission item when in progress
  in-progress-lore-footer:
    - ""
    - "&7In Progress..."

  # Progress line & bar (single-challenge missions)
  progress-line: "&7Progress: &e{progress}&7/&e{target}"

  # Multi-challenge missions — one line per challenge
  # Placeholders: {label} {progress} {target} {percent}
  challenge-line: "&7{label}&e{progress}&7/&e{target}"
  challenge-line-done: "&a✔ &a{label}&a{progress}&7/&a{target}"
  progress-bar-prefix: "&7["
  progress-bar-filled: "&a|"
  progress-bar-empty: "&c|"
  progress-bar-suffix: "&7] &e{percent}%"

  # Rewards header
  rewards-header: "&7Rewards:"
  reward-xp-line: "  &bHH XP: &e{xp}"
  reward-money-line: "  &aMoney: &e{currency}{money}"
  reward-bonus-line: "  &d+ Bonus rewards"

  # Unclaimed state
  unclaimed-ready: "&a&lREWARDS READY!"
  unclaimed-click: "&eClick to claim your rewards!"

  # Completed state
  completed-tag: "&a[COMPLETED]"
