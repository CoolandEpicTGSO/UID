# ============================================================
#   Spawner Shop GUI
# ============================================================
title: "&8[&cSpawner Shop&8]"
size: 54
filler-material: BLACK_STAINED_GLASS_PANE

# First and last (exclusive) slot used for spawner items
content-start: 9
content-end:   45

slots:
  back: 49
  prev: 45
  next: 53

# Name shown on the spawner item in the shop GUI.
# Placeholders: {mob}
shop-name: "&e{mob} Spawner"

# Name shown on the spawner item when it's in a player's inventory.
# Placeholders: {mob}
inventory-name: "&6{mob} Spawner"

# Lore shown on the spawner item inside the shop GUI.
# Placeholders: {mob} {level} {price} {currency}
# Status line is appended automatically (can buy / locked / no money)
shop-lore:
  - "&7Level Required: &e{level}"
  - "&7Price: &a{currency}{price}"
  - ""

# Lore shown on the spawner item when it's in a player's inventory.
# Placeholders: {mob} {level} {speed} {stack} {delay} {count}
inventory-lore:
  - "&7Mob: &e{mob}"
  - "&7Level Required: &e{level}"
  - "&7Speed Tier: &a{speed}/5 &7(delay: &e{delay}s&7)"
  - "&7Stack Tier: &a{stack}/5 &7(count: &e{count} mobs&7)"
  - ""
  - "&eRight-click to place"
  - "&eMine with Silk Touch to retrieve"

# ----------------------------------------------------------
#  Text customisation
# ----------------------------------------------------------
text:
  # Navigation buttons
  back-name: "&cBack"
  back-lore:
    - "&7Return to main menu"
  prev-name: "&7< Previous"
  next-name: "&7Next >"

  # Shop item name when locked (player level too low)
  shop-name-locked: "&c{mob} Spawner"

  # Status lines appended to shop-lore automatically
  status-can-buy: "&aClick to purchase!"
  status-locked: "&cRequires HH Level {level}"
  status-no-money: "&cNot enough money!"
