# ============================================================
#   RegentHeadHunting - Level Progression
#
#   Each level defines:
#     name              - Display name (supports color codes)
#     required-xp       - XP needed to reach this level
#     rankup-cost       - Money cost to rank up TO this level
#     mob-heads-required - Mob type -> number of heads that must be sold
#     rankup-commands   - Console commands run on rank up ({player})
#     mobs              - Mob types unlocked at this level
#     spawners          - Spawner types available in the Spawner Shop
#
#   Max level is determined by the highest number defined here.
#   Remove levels at the bottom to lower the max level — the
#   Spawner Shop will automatically hide those spawner types.
#   Add more levels (17, 18, 19...) to extend progression.
# ============================================================

