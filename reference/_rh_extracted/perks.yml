# ============================================================
#   RegentHeadHunting - Perks
#
#   Perks are passive upgrades unlocked by selling enough heads.
#
#   Fields per perk:
#     name               - display name (supports colour codes)
#     description        - one-line description
#     item               - Material shown in the GUI
#     item-slot          - GUI slot index
#     end-bonus          - fallback: bonus at max tier if no per-tier bonus set
#     max-tiers          - how many tiers (default 10)
#     default-money-cost - fallback cost if a tier has no money-cost set
#                          (scales as tier * default-money-cost)
#                          Set to 0 to disable money cost entirely.
#
#   Fields per tier:
#     heads-required  - total heads sold needed to unlock this tier
#     money-cost      - money required to unlock this tier
#     bonus           - the bonus value for this tier (overrides auto-calc)
#                       DOUBLE_DROP: 0.05 = 5% double-drop chance
#                       SELL_BONUS:  0.05 = 5% extra sell price
#                       XP_BONUS:    0.10 = 10% extra XP
#     reward-commands - console commands run on unlock ({player} placeholder)
# ============================================================

