# ============================================================
#   RegentHeadHunting - General Configuration
#   Plugin by TGSoCodes
#
#   Config files:
#     config.yml    - General settings, storage, messages
#     levels.yml    - Level progression
#     mobs.yml      - Mob head prices, drop chances, textures
#     spawners.yml  - Spawner shop and upgrade tiers
#     spawner-shop.yml - Spawner shop prices
#     boosters.yml  - Money and XP boosters
#     perks.yml     - Passive perks
#     missions.yml  - Daily, weekly and elite missions
#     gui.yml       - GUI layout and display
# ============================================================

general:
  prefix: "&8[&bHH&8] &r"
  debug: false
  currency-symbol: "$"
  auto-save-interval: 300
  spawn-conditions: true
  announce-drop: false
  announce-message: "&9[HeadHunting] &b{player} &7collected a &9{mob} Head&7!"
  item-name: "{color}{mob} Head"
  item-lore:
    - "&7A trophy head from a {color}{mob}&7."
    - ""
    - "&7Sell Price: &a{currency}{value}"
    - "&7Level: {color}{level}"
    - ""
    - "{color}(( Right-Click to Sell ))"

storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: headhunting
    username: root
    password: password
    pool-size: 10

messages:
  no-permission: "&cYou don't have permission to do that."
  player-only: "&cThis command can only be used by players."
  not-enough-money: "&cYou don't have enough money! You need &b{currency}{amount}&c."
  not-enough-xp: "&cYou don't have enough XP to level up yet."
  not-enough-heads-sold: "&cYou haven't sold enough heads to rank up yet!"
  not-enough-level: "&cYou need to be level &b{level} &cto do that!"
  already-max-level: "&bYou are already at the maximum level!"
  rank-up-success: "&9You have ranked up to &b{level}&9!"
  rank-up-notify: "&8» &bYou're ready to rank up to &9{level}&b! &7Use &b/hh &7to open the menu."
  rank-up-broadcast-5: "&8[&bHH&8] &b{player} &7has reached &9Level 5 &7in Head Hunting!"
  rank-up-broadcast-10: "&8[&bHH&8] &b{player} &7has reached &9Level 10 &7in Head Hunting!"
  rank-up-broadcast-max: "&8[&9&lHH&8] &9&l{player} &7has reached &9&lMAX LEVEL &7in Head Hunting! &9Insane."
  rank-up-fail-heads: "&cYou need to sell &b{required} &c{mob} heads first!"
  head-sold: "&aYou sold &b{amount} &a{mob} heads for &9{currency}{value}&a!"
  no-heads-to-sell: "&cYou don't have any eligible heads to sell."
  spawner-purchased: "&aYou purchased a &b{mob} Spawner &afor &9{currency}{price}&a!"
